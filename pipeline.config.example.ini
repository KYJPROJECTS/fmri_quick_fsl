; pipeline.config.example.ini
;
; Plantilla de referencia. NO la edites directamente: corre
; `python3 configure.py` desde la raíz del repo, que genera tu propio
; pipeline.config.ini (ese sí con tus rutas reales, y ese NO se versiona).
;
; Si prefieres crearlo a mano en vez de usar el asistente, copia este
; archivo a pipeline.config.ini y ajusta los valores.

[paths]
funcionales_dir = /ruta/a/tu/carpeta/funcionales
templates_dir = /ruta/a/tu/carpeta/templates
license_path = ~/license.txt
mango_exe = /mnt/c/Program Files/Mango/Mango.exe

[environment]
conda_env = bioimg
subject_id = 01

[thresholds]
motion_mm = 1.5
zstat_vmin = 2.3
alpha = 0.8

[docker]
bidscoin_image = marcelzwiers/bidscoin:latest
fmriprep_image = nipreps/fmriprep:latest
validator_image = bids/validator:latest
ants_image = antsx/ants:latest
